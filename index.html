<!doctype html>
<html lang="pt-BR" class="h-full bg-[#202126]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Metatags Anti-Forense e Prevenção de Cache no Disco -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="referrer" content="no-referrer" />

    <!-- PWA & Apple iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FocusFlow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#202126" />
    <meta name="description" content="Minimalist Focus & Pomodoro Timer" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>FocusFlow - Minimal Pomodoro</title>
  </head>
  <body class="h-full w-full bg-[#202126] text-neutral-100 antialiased overflow-hidden overscroll-none select-none">
    <div id="root" class="h-full w-full flex flex-col bg-[#202126]"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
